name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: orca-practice-server:ci
      # Deliberately not the default 3000, to prove the app honours PORT.
      PORT: "8080"
    steps:
      - uses: actions/checkout@v5
      - name: Docker build
        run: docker build -t "$IMAGE" .
      - name: Run container
        run: docker run -d --name app -e PORT="$PORT" -p "$PORT:$PORT" "$IMAGE"
      - name: Smoke test
        run: sh deploy/smoke.sh "http://localhost:$PORT"
      - name: Container logs
        if: failure()
        run: docker logs app
      - name: Stop container
        if: always()
        run: docker rm -f app
